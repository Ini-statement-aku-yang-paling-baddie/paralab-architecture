# Cloudflare terminates public TLS. This listener is reachable only on Docker's
# edge network by cloudflared; the Compose overlay publishes no host ports.
server {
    listen 8080 default_server;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location = / {
        return 404;
    }

    location ^~ /v1/f3/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://f3-api:7860;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ^~ /v1/f1/ {
        limit_req zone=api_per_ip burst=10 nodelay;
        proxy_pass http://model-gateway:8100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }

    location ^~ /v1/f2/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://model-gateway:8100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ^~ /v1/f4/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://model-gateway:8100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ^~ /v1/f5/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://model-gateway:8100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
